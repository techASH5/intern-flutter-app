name: aerokeep
description: "AeroKeep - Predictive Vehicle Maintenance Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Routing
  go_router: ^14.2.7
  
  # Network & API
  dio: ^5.7.0
  
  # Secure Storage
  flutter_secure_storage: ^9.2.2
  
  # Charts & Visualizations
  fl_chart: ^0.69.0
  
  # Icons
  lucide_icons: ^0.257.0
  
  # Local Notifications
  flutter_local_notifications: ^18.0.1
  
  # Fonts
  google_fonts: ^6.2.1
  
  # UI Utilities
  intl: ^0.19.0
  
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code generation for Riverpod
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
